name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# v10.1：同一分支的旧 CI run 直接取消——门禁几分钟就出结果，没有保留旧 run 的意义。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tool-contract:
    name: 工具契约检查（注册一致性 / 描述引用 / 快照）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 注册一致性（类定义 ↔ register 调用 + 工具名唯一）
        run: python3 scripts/check_tool_registration.py --src Sources/XosviMCP

      - name: 描述引用有效性（L2 失效引用 = 0）
        run: python3 scripts/lint_tool_descriptions.py --src Sources/XosviMCP --fail-on-refs

      - name: 描述三段式盘点（L1 存量，暂不阻断）
        run: python3 scripts/lint_tool_descriptions.py --src Sources/XosviMCP --warn-only

      - name: 注册表快照校验
        run: |
          if [ -f docs/registry.snapshot.json ]; then
            python3 scripts/dump_registry.py --src Sources/XosviMCP --check docs/registry.snapshot.json
          else
            echo "::warning::docs/registry.snapshot.json 尚未提交，跳过快照校验"
          fi

      - name: Python 语法自检
        run: python3 -m py_compile scripts/*.py tests/**/*.py 2>/dev/null || python3 -m py_compile scripts/*.py

      # 与下面 shell-gate 同脚本：CI 里装了 python3，所以会额外跑既有契约检查。
      - name: 静态门禁（脚本语法 / 路径 / 删除变量 / 持久化回退）
        run: bash scripts/check.sh -v

  swift-syntax:
    name: Swift 语法门禁（ubuntu swiftc -parse，快速失败）
    # 钉在 24.04：ubuntu-latest 已升到 26.04，镜像不再预装 swiftc，
    # 而 setup-swift@v2 又不认 26.04（"Version 26.04 of Ubuntu is not supported"）。
    # 24.04 自带 Swift，门禁可以照旧跑。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: swift version
        run: swift --version
      - name: Parse all Swift sources
        # v10.1：原来是逐文件起一个 swiftc（几百个文件 = 几百次进程启动，十几分钟）。
        # 改成批量解析一次；-parse 不做类型检查，同批多文件不会互相干扰，报错仍带 文件名:行:列。
        run: |
          set -o pipefail
          find Sources -name '*.swift' -print0 | sort -z | xargs -0 swiftc -parse > /tmp/parse.out 2>&1
          RC=$?
          if [ "$RC" -ne 0 ]; then
            grep -E '\.swift:[0-9]+:[0-9]+: error' /tmp/parse.out | sed -n '1,120p' || true
            echo "::error::Swift 解析失败（见上方文件:行:列，完整输出 /tmp/parse.out）"
            exit 1
          fi
          echo "OK: $(find Sources -name '*.swift' | wc -l) files parsed"

  brace-sanity:
    name: 括号/结构 sanity（存量脚本，暂不阻断）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python3 scripts/check_swift_braces.py
      - run: python3 scripts/check_braces.py
      - run: python3 scripts/check_tweak_braces.py

  parse-selftest:
    name: 静态解析自检（armor / crash.ips / bundle anatomy 真跑一遍）
    # v7.18 系列：这三套解析都是手写字节解析（Mach-O load commands、.ips 头/正文、.app 目录），
    # 本机没有 swiftc、真机 App 必须重新出包才能验证，所以「写完没人执行过」。
    # 这个 job 在 macOS runner 上把它们真跑一遍：用系统自带的真 Mach-O 二进制、
    # 合成的 .ips / .app 夹具，断言输出字段。不需要签名、不需要真机、不需要 iOS SDK。
    # 为什么是 macOS 而不是 ubuntu：StaticAnalysisSupport 用了 Compression
    # （COMPRESSION_ZLIB），Linux 的 Swift 没有这个模块。
    # 打桩只覆盖 MCPCore 里最小的一块（见 tests/parse/Stubs.swift 头注释），
    # 解析源码是**真文件**，不是拷贝。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: swift 版本
        run: swift --version

      - name: 编译解析层（真源码 + 最小打桩）
        run: |
          RC=0
          swiftc -O -o "$RUNNER_TEMP/parse_selftest" \
            Sources/XosviMCP/StaticAnalysisSupport.swift \
            Sources/XosviMCP/BinaryForensicsTool.swift \
            Sources/XosviMCP/CrashIPSTool.swift \
            Sources/XosviMCP/BundleAnatomy.swift \
            tests/parse/Stubs.swift \
            tests/parse/main.swift > "$RUNNER_TEMP/compile.log" 2>&1 || RC=$?
          if [ "$RC" -ne 0 ]; then
            sed -n '1,120p' "$RUNNER_TEMP/compile.log"
            grep -E 'error: ' "$RUNNER_TEMP/compile.log" | sed -n '1,10p' | while IFS= read -r line; do
              echo "::error title=parse-selftest-compile::$line"
            done
            exit 1
          fi
          echo "编译通过"

      - name: 跑断言
        run: |
          RC=0
          "$RUNNER_TEMP/parse_selftest" > "$RUNNER_TEMP/selftest.log" 2>&1 || RC=$?
          sed -n '1,400p' "$RUNNER_TEMP/selftest.log"
          if [ "$RC" -ne 0 ]; then
            grep -E 'FAIL' "$RUNNER_TEMP/selftest.log" | sed -n '1,10p' | while IFS= read -r line; do
              echo "::error title=parse-selftest::$line"
            done
            exit 1
          fi

  ios-build:
    name: iOS 构建（手动触发）
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: 预编译依赖
        run: |
          bash scripts/build-openssl.sh
          bash scripts/build-vanson.sh
      - name: 构建
        run: bash scripts/build-ipa.sh
