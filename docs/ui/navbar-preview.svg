<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" font-family="PingFang SC, -apple-system, Helvetica Neue, sans-serif">
  <defs>
    <style>
      .cap   { font-size: 22px; font-weight: 600; fill: #111; }
      .sub   { font-size: 15px; fill: #8a8a8e; }
      .ttl   { font-size: 26px; font-weight: 600; fill: #111; }
      .mono  { font-size: 20px; fill: #3c3c43; }
      .dim   { font-size: 18px; fill: #8a8a8e; }
      .capn  { font-size: 24px; font-weight: 500; fill: #111; }
      .det   { font-size: 20px; fill: #8a8a8e; }
      .tag   { font-size: 16px; fill: #b0b0b5; }
      .note  { font-size: 16px; fill: #e0342b; }
    </style>
  </defs>

  <rect width="880" height="620" fill="#f2f2f7"/>

  <text x="40" y="40" class="cap">会话页导航栏：改前 / 改后（手机宽度 360pt 片段，2× 放大）</text>

  <!-- ============ 改前 ============ -->
  <text x="40" y="86" class="tag">改前 · Minis 三行</text>
  <rect x="40" y="96" width="720" height="112" rx="10" fill="#ffffff" stroke="#d8d8dd"/>
  <line x1="40" y1="208" x2="760" y2="208" stroke="#e5e5ea"/>

  <!-- 标题 -->
  <text x="400" y="128" class="ttl" text-anchor="middle">分析这个 App 的加密逻辑</text>
  <!-- 第2行：状态点 + 模型名 + chevron -->
  <circle cx="322" cy="164" r="5" fill="#34c759"/>
  <text x="336" y="171" class="capn">DeepSeek V4</text>
  <path d="M420 160 l7 8 l7 -8" fill="none" stroke="#8a8a8e" stroke-width="2"/>
  <!-- 第3行：provider · model + 思考徽章 -->
  <text x="322" y="196" class="det">deepseek · deepseek-chat</text>
  <rect x="530" y="180" width="52" height="20" rx="10" fill="#00000014"/>
  <text x="556" y="195" class="tag" text-anchor="middle">思考 中</text>
  <!-- 尾部 -->
  <text x="722" y="165" class="dim" text-anchor="middle">•••</text>

  <!-- 改前问题标注 -->
  <text x="786" y="140" class="note" text-anchor="start">三行</text>
  <text x="786" y="162" class="note" text-anchor="start">重复</text>
  <text x="786" y="184" class="note" text-anchor="start">且挤</text>

  <!-- ============ 改后 ============ -->
  <text x="40" y="278" class="tag">改后 · xosvi 两行（任务名 + 模型快切胶囊）</text>
  <rect x="40" y="288" width="720" height="112" rx="10" fill="#ffffff" stroke="#d8d8dd"/>
  <line x1="40" y1="400" x2="760" y2="400" stroke="#e5e5ea"/>

  <!-- 标题 -->
  <text x="400" y="322" class="ttl" text-anchor="middle">分析这个 App 的加密逻辑</text>

  <!-- 胶囊：状态点 + 模型名 + 服务商·模型 + chevron -->
  <rect x="286" y="340" width="228" height="48" rx="24" fill="#e9e9ed" stroke="#d0d0d6" stroke-width="1.6"/>
  <circle cx="308" cy="364" r="6" fill="#34c759"/>
  <text x="324" y="372" class="capn">DeepSeek V4</text>
  <text x="432" y="370" class="det">deepseek · chat</text>
  <path d="M496 359 l8 9 l8 -9" fill="none" stroke="#8a8a8e" stroke-width="2"/>

  <!-- thinking 徽章在胶囊右侧 -->
  <rect x="528" y="350" width="56" height="26" rx="13" fill="#00000012"/>
  <text x="556" y="369" class="tag" text-anchor="middle">思考 中</text>

  <text x="722" y="365" class="dim" text-anchor="middle">•••</text>

  <text x="786" y="352" class="note" text-anchor="start">状态</text>
  <text x="786" y="374" class="note" text-anchor="start">点·名</text>

  <!-- ============ 局部放大 ============ -->
  <text x="40" y="452" class="tag">胶囊放大（4×）</text>
  <rect x="40" y="464" width="456" height="96" rx="48" fill="#e9e9ed" stroke="#d0d0d6" stroke-width="3"/>
  <circle cx="86" cy="512" r="12" fill="#34c759"/>
  <text x="118" y="527" class="cap" style="font-size:44px">DeepSeek V4</text>
  <text x="410" y="520" class="det" style="font-size:36px">chat</text>
  <path d="M452 496 l14 16 l14 -16" fill="none" stroke="#8a8a8e" stroke-width="4"/>

  <!-- 图例 -->
  <text x="540" y="500" class="sub">● 绿=已登录　黄=配额低　橙=未登录</text>
  <text x="540" y="528" class="sub">主字 12pt medium · 次字 10pt 灰（最宽 132pt）</text>
  <text x="540" y="556" class="sub">灰底胶囊 + 0.8pt 描边 · 高 24pt（旧系统 22pt）</text>
  <text x="540" y="584" class="sub">点击 → 模型选择面板（原行为不变）</text>
</svg>
